server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    # index.html first: a static frontend export may be copied into
    # public/ so the API origin can also serve the SPA (temporary
    # hosting until the dedicated frontend vhost is restored).
    # API routes still fall through to index.php below.
    index index.html index.php;

    # Employee CVs, contract scans and photos routinely exceed nginx's
    # 1 MB default. Without this, bigger uploads die with a reset
    # connection, which the browser reports as a network failure.
    # Must stay above FileStorageService::DOCUMENT_MAX_KB (10 MB).
    client_max_body_size 12M;

    # JSON payloads (dashboard aggregates, long lists) compress 70-85%.
    # Cloudflare compresses at the edge too; this covers direct origin hits.
    gzip on;
    gzip_min_length 256;
    gzip_types application/json;
    gzip_vary on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /favicon.svg { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # This container terminates plain HTTP while Cloudflare terminates
        # TLS in front of it. Without these, Laravel believes every request
        # arrived over http and generates http:// URLs, which the browser
        # then blocks as mixed content.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
        fastcgi_param HTTP_CF_IPCOUNTRY $http_cf_ipcountry;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # The app shell must never be cached: it carries the chunk URLs for
    # each deploy, and a stale copy boots stale (or half-missing) code.
    location ~* \.html$ {
        add_header Cache-Control "no-store";
    }
}